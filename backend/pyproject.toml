[project]
name = "human-layer-api"
version = "0.1.0"
description = "Document intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "alembic==1.16.5",
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
